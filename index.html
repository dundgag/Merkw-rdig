  return 'Das hat nicht geklappt. Bitte versuche es noch einmal.';
}
function magicSet(o){Object.assign(ui.magic,o);if(ui.edit&&ui.edit.kind==='magic')renderSheet()}
function parseJSONLoose(r,sample){
  try{if(sample&&sample.json)return sample.json(r)}catch(e){}
  const t=(r.text||'').replace(/```json|```/g,'');try{return JSON.parse(t)}catch(e){const m=t.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:'{}')}
}
A.magicTick=el=>{const r=ui.magic.res[+el.dataset.ix];if(r)r.on=el.checked};
A.magicRun=async()=>{
  formToDraft();const m=ui.magic,img=($('#mg-img')||{}).files&&$('#mg-img').files[0];
  if(!m.text.trim()&&!img){magicSet({msg:'Bitte Text einfügen oder ein Foto wählen.'});return}
  magicSet({busy:true,msg:'Claude liest …',res:null});
  try{
    const sample=await claude.use('sample');if(!sample)throw {code:'unavailable'};
    const td=today(),cats=S.cats.filter(c=>c.on).map(c=>c.name).join(', ');
    const opts={modelTier:'default',cache:false};
    if(img){const lim=await sample.limits();if(!lim||!lim.images)throw {code:'unavailable'};opts.images=[img]}
    const r=await sample('Heute ist '+td+' ('+fmtLong(td)+'). Erkenne in der Eingabe Termine, Aufgaben und Notizen. Antworte NUR mit JSON: {"entries":[{"type":"event|task|note","title":"kurz","date":"YYYY-MM-DD oder leer","time":"HH:MM oder leer","endT":"HH:MM oder leer","category":"eine von: '+cats+' oder leer","body":"Details oder leer"}]}. Regeln: Termine mit festem Zeitpunkt sind event, Dinge zu erledigen task, Infos note. Relative Angaben wie "nächsten Freitag" in ein konkretes Datum umrechnen. Nichts erfinden.\n\nEingabe:\n'+m.text,opts);
    const j=parseJSONLoose(r,sample),list=arr(j.entries).filter(x=>x&&x.title).slice(0,30).map(x=>{
      const c=S.cats.find(c=>c.name.toLowerCase()===String(x.category||'').toLowerCase());
      const ok=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s:'',okt=s=>/^\d{1,2}:\d{2}$/.test(s||'')?pad(+s.split(':')[0])+':'+s.split(':')[1]:'';
      let type=['event','task','note'].includes(x.type)?x.type:'note';const date=ok(x.date),time=okt(x.time);
      if(type==='event'&&!date)type='task';
      return {type,title:String(x.title).slice(0,120),date,time,endT:okt(x.endT),cat:c?c.id:'',body:String(x.body||'').slice(0,800),on:true}});
    magicSet({busy:false,res:list,msg:list.length?list.length+' Einträge erkannt. Prüfe und übernimm.':'Es wurde nichts erkannt.'});
  }catch(e){magicSet({busy:false,msg:magicErr(e)})}
};
A.magicApply=()=>{
  const l=(ui.magic.res||[]).filter(r=>r.on),n=Date.now();
  l.forEach(r=>{
    if(r.type==='event')S.events.push({id:uid(),title:r.title,cat:r.cat,tags:[],remind:'',date:r.date,end:'',start:r.time,endT:r.endT,allDay:!r.time,repeat:'none',until:'',place:'',note:r.body});
    else if(r.type==='task')S.tasks.push({id:uid(),title:r.title,cat:r.cat,tags:[],remind:'',due:r.date,prio:0,done:false,note:r.body,subs:[],repeat:'none',every:1});
    else S.notes.push({id:uid(),title:r.title,body:r.body,type:'text',items:[],cat:r.cat,tags:[],pinned:false,created:n,updated:n});
  });
  ui.magic={text:'',busy:false,msg:'',res:null,sum:''};ui.edit=null;persist();renderSheet();render();toast(l.length+' Einträge gespeichert');
};
A.magicSum=async()=>{
  formToDraft();const id=($('#mg-note')||{}).value,n=S.notes.find(x=>x.id===id);if(!n){magicSet({msg:'Bitte eine Notiz wählen.'});return}
  magicSet({busy:true,msg:'Claude fasst zusammen …',sum:''});
  try{
    const sample=await claude.use('sample');if(!sample)throw {code:'unavailable'};
    const body=n.type==='list'?n.items.map(i=>(i.d?'[x] ':'[ ] ')+i.t).join('\n'):n.body;
    const r=await sample('Fasse diese Notiz auf Deutsch in höchstens 5 kurzen Stichpunkten zusammen und nenne danach, falls vorhanden, offene To-dos. Keine Einleitung.\n\nTitel: '+n.title+'\n'+body,{modelTier:'quick',cache:false});
    magicSet({busy:false,msg:'',sum:r.text,sumTitle:'Zusammenfassung: '+n.title});
  }catch(e){magicSet({busy:false,msg:magicErr(e)})}
};
A.magicSumSave=()=>{const m=ui.magic,n=Date.now();S.notes.push({id:uid(),title:m.sumTitle||'Zusammenfassung',body:m.sum,type:'text',items:[],cat:ui.cat||'',tags:[],pinned:false,created:n,updated:n});persist();render();toast('Als Notiz gespeichert')};
