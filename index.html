  moneyPrev(){const d=fromYmd(ui.moneyMonth+'-01');d.setMonth(d.getMonth()-1);ui.moneyMonth=ymd(d).slice(0,7);render()},
  moneyNext(){const d=fromYmd(ui.moneyMonth+'-01');d.setMonth(d.getMonth()+1);ui.moneyMonth=ymd(d).slice(0,7);render()}

/* ---- Dokumente und Fristen ---- */
const DOCTYPES=['Versicherung','Vertrag','Ausweis / Pass','Abo','Garantie','Führerschein / Auto','Zeugnis / Urkunde','Sonstiges'];
ENT.doc={title:'Dokument',coll:'docs',blank:()=>({id:uid(),title:'',type:'Versicherung',expires:'',notice:30,link:'',note:'',cat:'',tags:[]}),
  fields:[['title','Bezeichnung','text','z. B. Reisepass'],['type','Art','sel',DOCTYPES.map(x=>[x,x])],['expires','Läuft ab / Frist','date'],['notice','Erinnerung (Tage vorher)','num'],['link','Aufbewahrungsort','text','z. B. Ordner Versicherungen'],['note','Notiz','area'],['cat','Kategorie','cat']]};
const docState=(x,td)=>!x.expires?{k:'none',c:'#64748B',t:'Ohne Frist'}:x.expires<td?{k:'over',c:'#D6336C',t:'Abgelaufen seit '+(-daysBetween(td,x.expires))+' T.'}:daysBetween(td,x.expires)<=(+x.notice||30)?{k:'soon',c:'#FF8A3D',t:'Noch '+daysBetween(td,x.expires)+' Tage'}:{k:'ok',c:'#2BB673',t:'Noch '+daysBetween(td,x.expires)+' Tage'};

function docRem(out){
  const now=Date.now(),td=today();
  const at=(d,h)=>{const x=fromYmd(d);x.setHours(h,0,0,0);return x.getTime()};
  if(modOn('docs'))S.docs.forEach(x=>{if(!x.expires||x.expires<td)return;const trig=at(addDays(x.expires,-(+x.notice||0)),9),key='doc|'+x.id+'|'+x.expires;
    if(+x.notice>0&&now>=trig&&!seen[key])out.push({key,title:x.title,cat:x.cat,at:trig,lbl:'Frist · ',txt:'Noch '+daysBetween(td,x.expires)+' Tage (bis '+fmtShort(x.expires)+')'})});
  if(modOn('people'))nextBdays().filter(b=>b.in<=1).forEach(b=>{const key='bd|'+b.p.id+'|'+b.date;if(!seen[key])out.push({key,title:b.p.name,cat:b.p.cat,at:at(b.date,9),lbl:'Geburtstag · ',txt:b.in===0?'Heute!':'Morgen'})});
}

/* ---- Fokus-Timer ---- */
ui.fo={run:false,end:0,left:25*60,dur:25*60,task:''};
const focusMinutes=td=>S.focus.filter(f=>ymd(new Date(f.at))===td).reduce((a,f)=>a+f.min,0);
function foLeft(){return ui.fo.run?Math.max(0,Math.round((ui.fo.end-Date.now())/1000)):ui.fo.left}
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);
let foTimer=null;
function foTick(){
  const l=foLeft(),t=$('#fotime'),r=$('#foring');
  if(t)t.textContent=mmss(l);if(r)r.style.setProperty('--p',(ui.fo.dur?(1-l/ui.fo.dur)*100:0)+'%');
  if(ui.fo.run&&l<=0)foFinish(true);
}
function foFinish(done){
  const mins=Math.round((ui.fo.dur-(done?0:foLeft()))/60);
  if(mins>=1)S.focus.push({at:Date.now(),min:mins,task:ui.fo.task||'',done:!!done});
  ui.fo.run=false;ui.fo.left=ui.fo.dur;clearInterval(foTimer);foTimer=null;persist();
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  toast(done?'Fokuszeit geschafft: '+mins+' Min.':'Beendet: '+mins+' Min. gespeichert');render();
}
function viewFocus(){
  const td=today(),wk=mondayOf(td),w=S.focus.filter(f=>ymd(new Date(f.at))>=wk).reduce((a,f)=>a+f.min,0);
  const open=S.tasks.filter(t=>!t.done);
  return `<div class="vh"><div><h1>Fokus</h1><p>Konzentriert arbeiten mit Timer. Jede Runde wird gezählt.</p></div></div>
  <div class="grid2"><div class="card" style="text-align:center"><div class="ring" id="foring" style="--p:0%"><div><b id="fotime">${mmss(foLeft())}</b><small>${ui.fo.run?'läuft':'bereit'}</small></div></div>
  <div class="seg" style="margin:14px 0">${[15,25,45,60].map(m=>`<button data-action="foDur" data-v="${m}" class="${ui.fo.dur===m*60?'on':''}"${ui.fo.run?' disabled':''}>${m} Min.</button>`).join('')}</div>
  <div class="fld" style="text-align:left"><label for="fotask">Woran arbeitest du?</label><select id="fotask"${ui.fo.run?' disabled':''}><option value="">Ohne Aufgabe</option>${open.map(t=>`<option value="${esc(t.title)}"${ui.fo.task===t.title?' selected':''}>${esc(t.title)}</option>`).join('')}</select></div>
  <div class="actions" style="justify-content:center">${ui.fo.run?`<button class="btn" data-action="foPause">${ic('pause')}Pause</button><button class="btn danger" data-action="foStop">Beenden</button>`:`<button class="btn primary" data-action="foStart">${ic('play')}${ui.fo.left<ui.fo.dur?'Weiter':'Start'}</button>${ui.fo.left<ui.fo.dur?'<button class="btn" data-action="foReset">Zurücksetzen</button>':''}`}</div></div>
  <div class="stack"><div class="tiles" style="grid-template-columns:repeat(2,1fr);margin:0"><div class="tile" style="--c:#F2557A"><b>${focusMinutes(td)}</b><span>Minuten heute</span></div><div class="tile" style="--c:#5B4CF0"><b>${w}</b><span>Minuten diese Woche</span></div></div>
  <div class="card"><h2>Letzte Runden</h2>${S.focus.slice(-8).reverse().map(f=>`<div class="row" style="--c:#F2557A"><div class="tm">${f.min}<small>Min.</small></div><div class="tx"><div class="t">${esc(f.task||'Fokuszeit')}</div><div class="s">${esc(dayLabel(ymd(new Date(f.at))))}</div></div></div>`).join('')||'<div class="empty">Noch keine Runde.</div>'}</div></div></div>`;
}
Object.assign(A,{
  foDur(el){if(ui.fo.run)return;ui.fo.dur=+el.dataset.v*60;ui.fo.left=ui.fo.dur;render()},
  foStart(){const s=$('#fotask');if(s)ui.fo.task=s.value;ui.fo.run=true;ui.fo.end=Date.now()+ui.fo.left*1000;clearInterval(foTimer);foTimer=setInterval(foTick,500);render()},
  foPause(){ui.fo.left=foLeft();ui.fo.run=false;clearInterval(foTimer);render()},
  foStop(){foFinish(false)},

/* ---- Wochenrückblick und Wochenziele ---- */
ui.revWeek=mondayOf(today());
function weekStats(wk){
  const end=addDays(wk,6),inW=t=>{const d=ymd(new Date(t));return d>=wk&&d<=end};
  const days=[...Array(7)].map((_,i)=>addDays(wk,i));
  const perDay=days.map(d=>S.doneLog.filter(x=>x.k==='task'&&ymd(new Date(x.at))===d).length);
  const tasks=S.doneLog.filter(x=>x.k==='task'&&inW(x.at)).length;
  const hab=S.doneLog.filter(x=>x.k==='habit'&&inW(x.at)).length;
  const foc=S.focus.filter(f=>inW(f.at)).reduce((a,f)=>a+f.min,0);
  const moods=days.map(d=>(S.journal[d]||{}).mood).filter(Boolean);
  const evs=days.reduce((a,d)=>a+S.events.filter(e=>expand(e,d,d).length).length,0);
  let spent=0;S.expenses.filter(e=>e.kind==='out'&&(!e.repeat||e.repeat==='none')&&e.date>=wk&&e.date<=end).forEach(e=>spent+=+e.amt||0);
  return {days,perDay,tasks,hab,foc,mood:moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0,evs,spent};
}
function goalsHome(){
  const g=weekGoals();if(!g.length)return '';

}

  <div class="grid2"><div class="stack"><div class="card"><h2>Erledigte Aufgaben pro Tag</h2><div class="cols">${st.perDay.map((n,i)=>`<div><i style="height:${Math.round(n/mx*100)}%"></i><b>${n}</b><span>${wd[i]}</span></div>`).join('')}</div><p class="hint" style="margin:10px 0 0">${st.evs} Termine · ${esc(eur(st.spent))} Ausgaben (einmalig)</p></div>

  ${goals.map(g=>`<div class="pk${g.d?' d':''}"><button class="pkt" data-action="goalTick" data-wk="${wk}" data-id="${esc(g.id)}"><b></b>${esc(g.t)}</button><button class="eye" data-action="goalDel" data-id="${esc(g.id)}" aria-label="Entfernen">✕</button></div>`).join('')||'<div class="empty">Noch keine Ziele. Setze dir 2 bis 3 pro Woche.</div>'}

/* ---- Verknüpfungen ---- */
function linkLabel(k,id){
  const f={note:()=>S.notes.find(x=>x.id===id),task:()=>S.tasks.find(x=>x.id===id),event:()=>S.events.find(x=>x.id===id),trip:()=>S.trips.find(x=>x.id===id),doc:()=>S.docs.find(x=>x.id===id)}[k];
  const it=f&&f();return it?{l:({note:'Notiz',task:'Aufgabe',event:'Termin',trip:'Reise',doc:'Dokument'})[k]+': '+(it.title||it.name),ok:true}:{l:'(gelöscht)',ok:false};
}
function linkField(d){
  const ls=arr(d.links),self=d.id;
  const opts=[].concat(S.notes.slice(-60).map(x=>['note:'+x.id,'Notiz: '+x.title]),S.tasks.filter(x=>!x.done).slice(-60).map(x=>['task:'+x.id,'Aufgabe: '+x.title]),S.events.slice(-40).map(x=>['event:'+x.id,'Termin: '+x.title]),S.trips.map(x=>['trip:'+x.id,'Reise: '+x.name]),S.docs.map(x=>['doc:'+x.id,'Dokument: '+x.title])).filter(o=>o[0].split(':')[1]!==self&&!ls.some(l=>l.k+':'+l.id===o[0]));

/* Direktanbindung (GitHub-Version): Google Identity Services + Calendar REST API */
function gisLoad(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  if(gisP)return gisP;
  gisP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=()=>res();sc.onerror=()=>{gisP=null;rej({code:'gis_failed'})};document.head.appendChild(sc)});
  return gisP;
}
function gToken(interactive){
  if(gTok.t&&Date.now()<gTok.exp-60000)return Promise.resolve(gTok.t);
  const g=GC();if(!g.clientId)return Promise.reject({code:'no_client'});
  if(!interactive)return Promise.reject({code:'needs_auth'});
  if(!(window.google&&google.accounts&&google.accounts.oauth2))return Promise.reject({code:'gis_failed'});
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:g.clientId,scope:'https://www.googleapis.com/auth/calendar',
      callback:r=>{if(r&&r.access_token){gTok={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};res(gTok.t)}else rej({code:'needs_auth',message:r&&r.error})},
      error_callback:e=>rej({code:e&&e.type==='popup_closed'?'declined':'needs_auth'})});
    tc.requestAccessToken();
  });
}
async function gApi(method,path,query,body){
  const tok=await gToken(gcManual);
  let url='https://www.googleapis.com/calendar/v3'+path;
  if(query){const q=new URLSearchParams();Object.entries(query).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')q.set(k,v)});const qs=q.toString();if(qs)url+='?'+qs}
  let r;try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}catch(e){throw {code:'network'}}
  if(r.status===401){gTok={t:'',exp:0};throw {code:'needs_auth'}}
  if(r.status===204)return {};
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:'http_'+r.status,message:(j.error&&j.error.message)||''};
  return j;
}
function toGBody(i){
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone,b={};
  if(i.summary!==undefined)b.summary=i.summary;
  if(i.startTime){if(i.allDay){b.start={date:i.startTime.slice(0,10)};b.end={date:(i.endTime||i.startTime).slice(0,10)}}else{b.start={dateTime:i.startTime,timeZone:tz};b.end={dateTime:i.endTime,timeZone:tz}}}
  if(i.location)b.location=i.location;if(i.description)b.description=i.description;
  if(i.recurrenceData)b.recurrence=i.recurrenceData;
  if(i.overrideReminders)b.reminders={useDefault:false,overrides:i.overrideReminders};
  return b;
}
async function gcalRest(tool,i){
  const cid=encodeURIComponent(i.calendarId||'primary');
  if(tool==='list_calendars'){const j=await gApi('GET','/users/me/calendarList',{maxResults:250});return {payload:{calendars:arr(j.items).map(c=>({id:c.id,summary:c.summaryOverride||c.summary}))}}}
  if(tool==='list_events'){const j=await gApi('GET','/calendars/'+cid+'/events',{timeMin:new Date(i.startTime).toISOString(),timeMax:new Date(i.endTime).toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:i.pageSize||250,pageToken:i.pageToken});return {payload:{events:j.items||[],nextPageToken:j.nextPageToken}}}

function csvSplit(line,d){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}

  if(hi<0)return null;

  const iD=ix('buchung','buchungstag','datum'),iV=ix('wertstellung'),iP=ix('auftraggeber','empfänger','beguenstigter','begünstigter','name'),iT=ix('buchungstext'),iZ=ix('verwendungszweck'),iA=ix('betrag');

function bankDecode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
async function bankLoad(file){

  const have=new Set(S.expenses.map(e=>e.bk).filter(Boolean)),have2=new Set(S.expenses.map(e=>e.date+'|'+(+e.amt).toFixed(2)+'|'+(e.title||'').toLowerCase()));

function dndGroupDate(txt){

function parseGrade(s){

  const m=s.match(/^([1-6])\s*([+\-−])$/);
  if(m&&GS()==='de')return Math.min(6,Math.max(1,+m[1]+(m[2]==='+'?-0.3:0.3)));
  const v=parseFloat(s);return isNaN(v)?NaN:v;
}
const fmtG=v=>isNaN(v)?'–':(GS()==='de'?v.toFixed(2):v.toFixed(1)).replace('.',',');
function gradeCol(v){
  if(isNaN(v))return '#64748B';
  return GS()==='de'?(v<=2.5?'#1E9E63':v<=3.5?'#F5A400':'#D6336C'):(v>=10?'#1E9E63':v>=5?'#F5A400':'#D6336C');
}
function examsOf(id){return S.exams.filter(e=>catIn(e.cat,id)&&catOn(catOf(e.cat)||null))}
function avgOf(list){let s=0,w=0;list.forEach(e=>{const v=parseGrade(e.grade);if(!isNaN(v)){const k=+e.weight>0?+e.weight:1;s+=v*k;w+=k}});return w?s/w:NaN}
function subjAvg(id){ // Durchschnitt über Fächer (gleich gewichtet), sonst direkt

}

  const y=v=>GS()==='de'?P+(v-lo)/(hi-lo)*(H-2*P):H-P-(v-lo)/(hi-lo)*(H-2*P),x=i=>P+i*(W-2*P)/(pts.length-1);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px" role="img" aria-label="Notenverlauf"><polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${gradeCol(v)}"/>`).join('')}</svg>`;

  const a=abiData(),pts=[];let low=0,zero=0;
  a.s.forEach(s=>{let ks=0;s.p.forEach(v=>{const x=abiNum(v);if(isNaN(x))return;if(/sport/i.test(s.n)&&++ks>3)return;pts.push(x);if(x<5)low++;if(x===0)zero++})});
  const exs=a.s.filter(s=>s.ex),ex=exs.map(s=>abiNum(s.e)).filter(x=>!isNaN(x)),exLow=ex.filter(x=>x>=5).length;
  let ip=pts.slice(),ep=ex.slice();

  const i=ip.length?ip.reduce((x,y)=>x+y,0)/ip.length*40:NaN,ii=ep.length?ep.reduce((x,y)=>x+y,0)/ep.length*20:NaN;

  loadFileAsk(){let i=$('#bkfile2');if(!i){i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.id='bkfile2';i.hidden=true;document.body.appendChild(i);i.addEventListener('change',async()=>{const f=i.files&&i.files[0];i.value='';if(!f)return;try{const r=JSON.parse(await f.text());if(!r||typeof r!=='object'||!Array.isArray(r.tasks))throw 0;if(!confirm('Alle aktuellen Daten durch diese Sicherung ersetzen?'))return;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,normalize(r));persist();render();toast('Sicherung geladen')}catch(e){toast('Datei nicht lesbar')}})}i.click()}
});

/* ---- Dienstplan: ein Tipp aus Google Kalender ---- */
SHEETS.gshift=e=>{
  const g=GC(),s=ui.gs,cal=S.settings.shiftCal||s.cal||'',l=g.list||[];
  return `<h2>Dienstplan aus Google Kalender</h2>
  <p class="hint">Jeder Termin des gewählten Kalenders wird ein Dienst. Der Titel wird zum Diensttyp, zum Beispiel „Früh“ oder „Nacht“. Es werden 30 Tage zurück und 4 Monate voraus geladen.</p>
  ${l.length?`<div class="fld"><label for="gsh-cal">Kalender</label><select id="gsh-cal"><option value="">Kalender wählen …</option>${l.map(c=>`<option value="${esc(c.id)}"${cal===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}
  ${s.msg?`<p style="font-weight:700;margin:8px 0">${esc(s.msg)}</p>`:''}
  <div class="actions"><button class="btn" data-action="closeSheet">Schließen</button><span class="sp"></span><button class="btn primary" data-action="gshRun"${s.busy?' disabled':''}>${l.length?(S.settings.shiftCal?'Aktualisieren':'Importieren'):'Kalender laden'}</button></div>`};
A.gshOpen=()=>{ui.edit={kind:'gshift',draft:{}};ui.gs.msg='';renderSheet()};
A.gshRun=async()=>{
  gcUser();const g=GC();
  try{
    if(!(g.list||[]).length){gsSet({busy:true,msg:'Lade Kalender …'});await gcalLoadList();
      const p=g.list.find(c=>/dienst|schicht|arbeit/i.test(c.name));if(p&&!S.settings.shiftCal)ui.gs.cal=p.id;gsSet({busy:false,msg:'Wähle den Kalender mit deinen Diensten.'});return}
    const sel=$('#gsh-cal'),cal=sel&&sel.value||S.settings.shiftCal;if(!cal){gsSet({msg:'Bitte einen Kalender wählen.'});return}
    gsSet({busy:true,msg:'Lade Dienste …'});
    const r=await gcalFetch(cal,addDays(today(),-30),addDays(today(),120)),list=[];
    r.out.forEach(ev=>{if(ev.status==='cancelled')return;const v=gcConv(ev);if(!v)return;const nm=v.title.trim();if(!nm)return;
      list.push({date:v.date,name:nm,start:v.allDay?'':v.start,end:v.allDay?'':v.endT});
      if(v.end)for(let d=addDays(v.date,1);d<=v.end;d=addDays(d,1))list.push({date:d,name:nm,start:'',end:''})});
    if(!list.length){gsSet({busy:false,msg:'Keine Termine in diesem Zeitraum.'});return}
    const a=applyShiftImport(list);S.settings.shiftCal=cal;persist();
    gsSet({busy:false,msg:a.n+' Dienste übernommen'+(a.newT?' ('+a.newT+' neue Diensttypen)':'')+'.'});render();
  }catch(e){gsSet({busy:false,msg:gcalErr(e)})}
};
